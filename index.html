<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Laboratorio delle forme 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #17324d;
      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #eaf8ff 45%,
          #ccecff 100%
        );
    }

    header {
      padding: 20px 15px 14px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #15508a;
      font-size: clamp(28px, 5vw, 46px);
    }

    header p {
      max-width: 800px;
      margin: 9px auto 0;
      color: #42627d;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: bold;
      line-height: 1.5;
    }

    #app {
      display: grid;
      grid-template-columns: 235px minmax(480px, 1fr) 250px;
      gap: 16px;
      width: min(1500px, 97%);
      margin: 0 auto;
      padding-bottom: 110px;
    }

    .panel {
      border: 3px solid white;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 28px rgba(20, 70, 110, 0.16);
    }

    /* PANNELLO LIVELLO */

    #levelPanel {
      padding: 18px;
    }

    #levelPanel h2 {
      margin: 0 0 10px;
      color: #15508a;
    }

    #levelNumber {
      display: inline-block;
      margin-bottom: 13px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e4f6ff;
      color: #15508a;
      font-weight: bold;
    }

    #levelDescription {
      min-height: 95px;
      margin: 0;
      line-height: 1.5;
    }

    #scoreBox {
      margin: 16px 0;
      padding: 12px;
      border-radius: 14px;
      background: #fff4c7;
      color: #755600;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    #progressBox {
      margin: 12px 0;
      padding: 10px;
      border-radius: 12px;
      background: #e9f8ff;
      color: #15508a;
      font-weight: bold;
      text-align: center;
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 9px;
      border: 0;
      border-radius: 14px;
      padding: 10px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
      transform: none;
    }

    #foldButton {
      background: linear-gradient(135deg, #ff9f1c, #ff6b35);
    }

    #hintButton {
      background: linear-gradient(135deg, #2ec4b6, #218b83);
    }

    #resetButton {
      background: linear-gradient(135deg, #4d96ff, #266ac7);
    }

    #nextButton {
      background: linear-gradient(135deg, #9365f7, #673ac5);
    }

    /* AREA DI COSTRUZIONE */

    #gamePanel {
      position: relative;
      min-height: 630px;
      padding: 16px;
      overflow: hidden;
    }

    #gamePanel h2,
    #piecesPanel h2 {
      margin: 0 0 12px;
      color: #15508a;
      text-align: center;
    }
